name: quickeat
description: "A new Flutter project."
publish_to: 'none'

version: 1.4.0+7

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.14.0
  cloud_firestore: ^6.9.0
  firebase_auth: ^6.6.1
  provider: ^6.1.2
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/quickeat.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/quickeat.png